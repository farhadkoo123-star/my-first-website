<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم ثبت‌نام و مدیریت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: Vazirmatn, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 1rem; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 500px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e293b; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-family: inherit; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        #adminPanel { display: none; max-width: 800px; margin-top: 20px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: white; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: right; }
        th { background: #f1f5f9; }
        .success { color: #16a34a; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- فرم ثبت‌نام -->
    <div id="registerForm" class="card">
        <h2>فرم ثبت‌نام جدید</h2>
        <input type="text" id="name" placeholder="نام و نام خانوادگی">
        <input type="tel" id="mobile" placeholder="شماره موبایل">
        <input type="text" id="nationalId" placeholder="کد ملی">
        <button onclick="register()">ثبت اطلاعات</button>
        <p id="msg" class="success">اطلاعات با موفقیت ذخیره شد!</p>
        <hr>
        <button style="background: #64748b;" onclick="showLogin()">ورود به مدیریت</button>
    </div>

    <!-- پنل مدیریت -->
    <div id="adminPanel">
        <div class="card" style="max-width: 100%;">
            <h2>لیست ثبت‌نام شده‌ها (از گوگل شیت)</h2>
            <button onclick="loadData()" style="background: #10b981; margin-bottom: 10px;">بروزرسانی لیست</button>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>نام</th>
                            <th>موبایل</th>
                            <th>کد ملی</th>
                            <th>تاریخ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <button style="margin-top: 20px; background: #ef4444;" onclick="location.reload()">خروج</button>
        </div>
    </div>

    <script>
        // آدرس وب‌اپ گوگل را اینجا بگذارید
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhbjA0UaerCHtfqpmqrqDAVSWzWTBAEX5Wep1VyJliH4A-TM1Wba-UAska-QhtD1Vm/exec';

        async function register() {
            const data = {
                name: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                nationalId: document.getElementById('nationalId').value
            };

            if(!data.name || !data.mobile) return alert('لطفا فیلدها را پر کنید');

            const btn = document.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'در حال ارسال...';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                document.getElementById('msg').style.display = 'block';
                document.getElementById('name').value = '';
                document.getElementById('mobile').value = '';
                document.getElementById('nationalId').value = '';
            } catch (e) {
                alert('خطا در اتصال به سرور');
            } finally {
                btn.disabled = false;
                btn.innerText = 'ثبت اطلاعات';
            }
        }

        function showLogin() {
            const pass = prompt('رمز عبور مدیر را وارد کنید:');
            if (pass === '1234') { // رمز عبور پیش‌فرض
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadData();
            } else {
                alert('رمز اشتباه است');
            }
        }

        async function loadData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="4">در حال دریافت اطلاعات...</td></tr>';
            
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                tbody.innerHTML = data.map(row => `
                    <tr>
                        <td>${row.name}</td>
                        <td>${row.mobile}</td>
                        <td>${row.nationalId}</td>
                        <td>${row.date}</td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4">خطا در دریافت اطلاعات</td></tr>';
            }
        }
    </script>
</body>
</html>

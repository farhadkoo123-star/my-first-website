<!DOCTYPE html>
<html dir="rtl" lang="fa">
<body>
    <h2>فرم ثبت‌نام</h2>
    <input type="text" id="fullName" placeholder="نام و نام خانوادگی">
    <input type="tel" id="phone" placeholder="تلفن">
    <input type="text" id="nationalCode" placeholder="کد ملی">
    <button onclick="register()">ثبت‌نام</button>

    <script>
        async function register() {
            const URL = https://script.google.com/macros/s/AKfycbwuLoYgHsfRUweMnLaopbL9r2lhieCOpdFeKuSkqCn_wJApvQHAtTqsCJc9IccWpTsA/exec
            const data = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                nationalCode: document.getElementById('nationalCode').value
            };

            await fetch(URL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: JSON.stringify(data) 
            });
            alert("ثبت‌نام با موفقیت انجام شد!");
        }
    </script>
</body>
</html>

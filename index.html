<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیش‌فروش کتاب</title>
<style>
  :root {
    --bg: oklch(97% 0.005 260);
    --surface: oklch(100% 0 0);
    --border: oklch(88% 0.01 260);
    --text: oklch(20% 0.02 260);
    --muted: oklch(55% 0.02 260);
    --accent: oklch(52% 0.18 260);
    --accent-hover: oklch(45% 0.18 260);
    --danger: oklch(55% 0.2 25);
    --success: oklch(52% 0.16 155);
    --radius: 8px;
    --radius-sm: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 1px 4px oklch(0% 0 0 / 0.06);
  }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    transition: border-color 120ms ease;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input.error { border-color: var(--danger); }
  .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 4px; display: none; }
  .error-msg.show { display: block; }
  button {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 120ms ease;
    margin-top: 8px;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .alert {
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    margin-top: 16px;
    display: none;
  }
  .alert.success { background: oklch(95% 0.06 155); color: oklch(30% 0.12 155); display: block; }
  .alert.error { background: oklch(95% 0.06 25); color: oklch(35% 0.15 25); display: block; }
  /* Admin */
  #adminPanel { display: none; }
  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 0.75rem;
    background: oklch(92% 0.08 260);
    color: var(--accent);
  }
  .nav { display: flex; gap: 8px; margin-bottom: 24px; }
  .nav a { font-size: 0.875rem; color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<!-- فرم ثبت‌نام -->
<div class="card" id="registerCard">
  <h1>📚 پیش‌فروش کتاب</h1>
  <p class="subtitle">برای رزرو نسخه خود اطلاعات زیر را وارد کنید.</p>

  <div class="field">
    <label for="name">نام و نام خانوادگی</label>
    <input type="text" id="name" placeholder="علی محمدی">
    <div class="error-msg" id="nameErr">نام الزامی است.</div>
  </div>
  <div class="field">
    <label for="mobile">شماره موبایل</label>
    <input type="tel" id="mobile" placeholder="09123456789">
    <div class="error-msg" id="mobileErr">شماره موبایل معتبر نیست.</div>
  </div>
  <div class="field">
    <label for="nationalId">کد ملی</label>
    <input type="text" id="nationalId" placeholder="0123456789" maxlength="10">
    <div class="error-msg" id="nationalIdErr">کد ملی ۱۰ رقمی معتبر نیست.</div>
  </div>

  <button onclick="register()">ثبت پیش‌سفارش</button>
  <div class="alert" id="registerAlert"></div>
  <div style="text-align:center; margin-top:16px;">
    <a style="font-size:0.8rem; color:var(--muted); cursor:pointer;" onclick="showAdmin()">ورود مدیر</a>
  </div>
</div>

<!-- ورود مدیر -->
<div class="card" id="loginCard" style="display:none;">
  <h1>ورود مدیر</h1>
  <div class="field" style="margin-top:16px;">
    <label for="adminPass">رمز عبور</label>
    <input type="password" id="adminPass" placeholder="••••••">
  </div>
  <button onclick="login()">ورود</button>
  <div class="alert" id="loginAlert"></div>
  <div style="text-align:center; margin-top:12px;">
    <a style="font-size:0.8rem; color:var(--muted); cursor:pointer;" onclick="showRegister()">بازگشت</a>
  </div>
</div>

<!-- پنل مدیریت -->
<div class="card" id="adminPanel" style="max-width:720px;">
  <div class="admin-header">
    <h1>پنل مدیریت</h1>
    <button onclick="logout()" style="width:auto; padding:8px 16px; font-size:0.875rem;">خروج</button>
  </div>
  <div id="statsBar" style="margin-bottom:16px; color:var(--muted); font-size:0.875rem;"></div>
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr><th>#</th><th>نام</th><th>موبایل</th><th>کد ملی</th><th>تاریخ</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" style="text-align:center; padding:32px; color:var(--muted); display:none;">هنوز ثبت‌نامی انجام نشده.</div>
</div>

<script>
const ADMIN_PASS = 'admin1234';
const STORAGE_KEY = 'presale_orders';

function getOrders() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}
function saveOrders(orders) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
}

function validateNationalId(id) {
  if (!/^\d{10}$/.test(id)) return false;
  const d = id.split('').map(Number);
  if (d.every(x => x === d[0])) return false;
  const sum = d.slice(0, 9).reduce((s, v, i) => s + v * (10 - i), 0);
  const rem = sum % 11;
  return (rem < 2 && d[9] === rem) || (rem >= 2 && d[9] === 11 - rem);
}

function register() {
  const name = document.getElementById('name').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  const nationalId = document.getElementById('nationalId').value.trim();
  let valid = true;

  const setErr = (id, inputId, show) => {
    document.getElementById(id).classList.toggle('show', show);
    document.getElementById(inputId).classList.toggle('error', show);
    if (show) valid = false;
  };

  setErr('nameErr', 'name', !name);
  setErr('mobileErr', 'mobile', !/^09\d{9}$/.test(mobile));
  setErr('nationalIdErr', 'nationalId', !validateNationalId(nationalId));

  if (!valid) return;

  const orders = getOrders();
  if (orders.some(o => o.nationalId === nationalId)) {
    showAlert('registerAlert', 'این کد ملی قبلاً ثبت شده است.', 'error');
    return;
  }

  orders.push({ name, mobile, nationalId, date: new Date().toLocaleDateString('fa-IR') });
  saveOrders(orders);
  showAlert('registerAlert', 'ثبت‌نام شما با موفقیت انجام شد. 🎉', 'success');
  ['name','mobile','nationalId'].forEach(id => document.getElementById(id).value = '');
}

function login() {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASS) {
    sessionStorage.setItem('admin', '1');
    showAdminPanel();
  } else {
    showAlert('loginAlert', 'رمز عبور اشتباه است.', 'error');
  }
}

function logout() {
  sessionStorage.removeItem('admin');
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('registerCard').style.display = 'block';
}

function showAdminPanel() {
  ['registerCard','loginCard'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('adminPanel').style.display = 'block';
  renderTable();
}

function renderTable() {
  const orders = getOrders();
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('statsBar').textContent = `مجموع ثبت‌نام‌ها: ${orders.length}`;
  if (!orders.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = orders.map((o, i) => `
    <tr>
      <td><span class="badge">${i + 1}</span></td>
      <td>${o.name}</td>
      <td style="direction:ltr">${o.mobile}</td>
      <td style="direction:ltr">${o.nationalId}</td>
      <td>${o.date}</td>
    </tr>`).join('');
}

function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `alert ${type}`;
}

function showAdmin() {
  document.getElementById('registerCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'block';
}

function showRegister() {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('registerCard').style.display = 'block';
}

if (sessionStorage.getItem('admin')) showAdminPanel();
</script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="fa">
<body>
    <h2>لیست ثبت‌نامی‌ها</h2>
    <table border="1" id="adminTable">
        <tr><th>نام</th><th>تلفن</th><th>کد ملی</th><th>تاریخ</th></tr>
    </table>

    <script>
        const URL = https://script.google.com/macros/s/AKfycbwuLoYgHsfRUweMnLaopbL9r2lhieCOpdFeKuSkqCn_wJApvQHAtTqsCJc9IccWpTsA/exec
        const pass = prompt("رمز عبور:");
        if(pass === "1234") {
            fetch(URL)
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById('adminTable');
                data.slice(1).forEach(row => {
                    table.innerHTML += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`;
                });
            });
        }
    </script>
</body>
</html>
